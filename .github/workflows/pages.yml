name: Publicar CRM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Montar site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat .parts/index.*.b64 | tr -d '\r\n' | base64 -d > _site/index.html
          cat .parts/app.gz.*.b64 | tr -d '\r\n' | base64 -d | gzip -dc > _site/app.js
          cp config.js _site/config.js
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/app.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
